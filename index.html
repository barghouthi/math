<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Math Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
        }
        
        .menu h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .menu button {
            font-size: 1.4em;
            padding: 15px 25px;
            border: 2px solid #333;
            background: white;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s;
            min-height: 60px;
            touch-action: manipulation;
        }
        
        .menu button:hover, .menu button:active {
            background-color: #f0f0f0;
        }
        
        .problem {
            font-size: min(12em, 13vw); /* desktop; phones override below */
            margin: 20px 0;
            cursor: pointer;
            user-select: none;
            padding: 20px;
            border-radius: 10px;
            transition: background-color 0.2s;
            touch-action: manipulation;
        }
        
        .problem:hover, .problem:active {
            background-color: #f8f8f8;
        }
        
        .blue-answer {
            color: blue;
        }

        .problem.flashcard {
            font-size: min(60vw, 60vh);
            font-weight: bold;
            line-height: 1;
        }
        
        .counter {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.5em;
            color: #666;
        }
        
        .back-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2em;
            padding: 8px 16px;
            border: 2px solid #333;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            touch-action: manipulation;
        }
        
        .back-button:hover, .back-button:active {
            background-color: #f0f0f0;
        }
        
        .hidden {
            display: none;
        }
        
        .tap-instruction {
            font-size: 1.2em;
            color: #666;
            margin-top: 20px;
            padding: 0 20px;
        }
        
        /* Mobile specific styles */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .menu h1 {
                font-size: 2em;
                margin-bottom: 15px;
            }
            
            .menu button {
                font-size: 1.2em;
                padding: 12px 20px;
                min-height: 50px;
            }
            
            .problem {
                font-size: 3em;
                margin: 15px 0;
                padding: 15px;
            }

            .problem.flashcard {
                font-size: min(75vw, 65vh);
            }

            .counter {
                font-size: 1.3em;
                top: 5px;
                left: 5px;
            }
            
            .back-button {
                font-size: 1em;
                padding: 6px 12px;
                top: 5px;
                right: 5px;
            }
            
            .tap-instruction {
                font-size: 1em;
                margin-top: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .menu h1 {
                font-size: 1.8em;
            }
            
            .menu button {
                font-size: 1.1em;
                padding: 10px 15px;
            }
            
            .problem {
                font-size: 2.5em;
                margin: 10px 0;
                padding: 10px;
            }

            .problem.flashcard {
                font-size: min(80vw, 65vh);
            }
            
            .counter {
                font-size: 1.2em;
            }
            
            .back-button {
                font-size: 0.9em;
                padding: 5px 10px;
            }
        }

        /* ---------- Fun times tables ---------- */
        .menu button.tt {
            color: white;
            font-weight: bold;
            border: none;
            text-shadow: 0 2px 0 rgba(0,0,0,0.25);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .menu button.tt:hover, .menu button.tt:active {
            filter: brightness(1.1);
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        body.fun {
            background: linear-gradient(135deg, var(--fun-a), var(--fun-b));
            background-attachment: fixed;
        }
        body.fun .problem {
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.15);
            font-weight: bold;
            padding: 20px 40px;
        }
        body.fun .problem:hover, body.fun .problem:active {
            background: white;
        }
        body.fun .counter, body.fun .tap-instruction {
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }
        body.fun .back-button {
            border: none;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            font-weight: bold;
        }
        .fun-num { display: inline-block; }
        .fun-pop { animation: pop 0.25s ease-out; }
        .fun-answer {
            display: inline-block;
            color: #ff2d95;
            animation: answer-bounce 0.6s cubic-bezier(.2, 1.6, .4, 1);
        }
        @keyframes pop {
            from { transform: scale(0.6); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        @keyframes answer-bounce {
            0%   { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0); }
        }
        #confetti {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="menu" class="menu">
        <h1>Choose Your Practice</h1>
        <button onclick="startPractice('flashcards-1-10', 10)">Random 1-10 Flash Cards</button>
        <button onclick="startPractice('flashcards-10-20', 20)">Random 10-20 Flash Cards</button>
        <button onclick="startPractice('flashcards-az', 0)">A-Z Flash Cards</button>
        <button onclick="startPractice('addition', 5)">Addition up to 5</button>
        <button onclick="startPractice('addition-operands-5', 5)">Addition with Numbers up to 5</button>
        <button onclick="startPractice('addition', 10)">Addition up to 10</button>
        <button onclick="startPractice('addition-1-20', 20)">Addition 1-20</button>
        <button onclick="startPractice('addition-10-20', 20)">Addition 10-20</button>
        <button onclick="startPractice('addition-multiples', 100)">Addition Multiples of 10 (up to 100)</button>
        <button onclick="startPractice('multiples-5-10-addition', 200)">Addition by 5/10 (Multiples up to 200)</button>
        <button onclick="startPractice('multiples-5-10-subtraction', 200)">Subtraction by 5/10 (Multiples up to 200)</button>
        <button onclick="startPractice('subtraction', 20)">Subtraction</button>
        <button onclick="startPractice('times-table', 2)">2 Times Table</button>
        <button onclick="startPractice('times-table', 3)">3 Times Table</button>
        <button onclick="startPractice('times-table', 4)">4 Times Table</button>
        <button onclick="startPractice('times-table', 5)">5 Times Table</button>
        <button onclick="startPractice('times-table', 6)">6 Times Table</button>
        <button onclick="startPractice('times-table', 7)">7 Times Table</button>
        <button onclick="startPractice('times-table', 8)">8 Times Table</button>
        <button onclick="startPractice('times-table', 9)">9 Times Table</button>
    </div>
    
    <div id="practice" class="hidden">
        <div class="counter" id="counter">0</div>
        <button class="back-button" onclick="goBack()">Menu</button>
        <div class="problem" id="problem" onclick="handleProblemClick()"></div>
        <div class="tap-instruction">Tap the problem to see the answer, then tap again for the next problem</div>
    </div>

    <canvas id="confetti"></canvas>

    <script>
        let currentAnswer = 0;
        let showingAnswer = false;
        let problemCount = 0;
        let allProblems = [];
        let currentMode = '';
        let currentMax = 0;

        function generateProblems(operation, maxSum) {
            const problems = [];
            let minSum = 1;
            
            // Handle different addition ranges
            if (operation === 'addition-10-20') {
                minSum = 10; // Addition 10-20
            } else if (operation === 'addition-1-20') {
                minSum = 1;  // Addition 1-20
            } else if (operation === 'addition') {
                minSum = 1;  // Addition up to 10 or other ranges
            }
            
            if (operation === 'flashcards-1-10') {
                // Single number flash cards 1-10
                for (let i = 1; i <= 10; i++) {
                    problems.push([i, null, 'flash']);
                }
            } else if (operation === 'flashcards-10-20') {
                // Single number flash cards 10-20
                for (let i = 10; i <= 20; i++) {
                    problems.push([i, null, 'flash']);
                }
            } else if (operation === 'times-table') {
                // Multiplication table for maxSum, skipping x1, x2 and x10
                for (let k = 3; k <= 9; k++) {
                    problems.push([maxSum, k, '×']);
                }
            } else if (operation === 'flashcards-az') {
                // Single letter flash cards A-Z
                for (let i = 65; i <= 90; i++) {
                    problems.push([String.fromCharCode(i), null, 'flash']);
                }
            } else if (operation === 'addition-operands-5') {
                // Each number is at most maxSum (so the sum is at most 2 * maxSum)
                for (let num1 = 1; num1 <= maxSum; num1++) {
                    for (let num2 = 1; num2 <= maxSum; num2++) {
                        problems.push([num1, num2, '+']);
                    }
                }
            } else if (operation === 'addition-multiples') {
                // Generate multiples of 10 up to maxSum
                const multiples = [];
                for (let i = 10; i <= maxSum; i += 10) {
                    multiples.push(i);
                }
                
                // Generate all combinations of multiples that sum up to maxSum
                for (let i = 0; i < multiples.length; i++) {
                    for (let j = i; j < multiples.length; j++) {
                        let sum = multiples[i] + multiples[j];
                        if (sum <= maxSum) {
                            problems.push([multiples[i], multiples[j], '+']);
                            // Add the reverse if different numbers
                            if (multiples[i] !== multiples[j]) {
                                problems.push([multiples[j], multiples[i], '+']);
                            }
                        }
                    }
                }
            } else if (operation === 'multiples-5-10') {
                // Generate multiples of 5 and 10 up to maxSum
                const multiples = [];
                for (let i = 5; i <= maxSum; i += 5) {
                    multiples.push(i);
                }
                
                // For each multiple, create problems adding/subtracting 5 or 10
                for (let multiple of multiples) {
                    // Add 5
                    if (multiple + 5 <= maxSum) {
                        problems.push([multiple, 5, '+']);
                    }
                    // Add 10
                    if (multiple + 10 <= maxSum) {
                        problems.push([multiple, 10, '+']);
                    }
                    // Subtract 5 (only if result is positive and a multiple of 5)
                    if (multiple - 5 > 0) {
                        problems.push([multiple, 5, '-']);
                    }
                    // Subtract 10 (only if result is positive and a multiple of 5)
                    if (multiple - 10 > 0) {
                        problems.push([multiple, 10, '-']);
                    }
                }
                
                // Also create problems where we start with a multiple and add/subtract to get another multiple
                for (let i = 0; i < multiples.length; i++) {
                    for (let j = 0; j < multiples.length; j++) {
                        if (i !== j) {
                            let diff = Math.abs(multiples[i] - multiples[j]);
                            if (diff === 5 || diff === 10) {
                                if (multiples[i] > multiples[j]) {
                                    problems.push([multiples[i], diff, '-']);
                                } else {
                                    problems.push([multiples[j], diff, '-']);
                                }
                            }
                        }
                    }
                }
            } else if (operation === 'multiples-5-10-addition') {
                // Generate multiples of 5 and 10 up to maxSum
                const multiples = [];
                for (let i = 5; i <= maxSum; i += 5) {
                    multiples.push(i);
                }
                
                // For each multiple, create addition problems with 5 or 10
                for (let multiple of multiples) {
                    // Add 5
                    if (multiple + 5 <= maxSum) {
                        problems.push([multiple, 5, '+']);
                    }
                    // Add 10
                    if (multiple + 10 <= maxSum) {
                        problems.push([multiple, 10, '+']);
                    }
                }
                
                // Also create problems where we add 5 or 10 to get from one multiple to another
                for (let i = 0; i < multiples.length; i++) {
                    for (let j = 0; j < multiples.length; j++) {
                        if (i !== j && multiples[j] > multiples[i]) {
                            let diff = multiples[j] - multiples[i];
                            if (diff === 5 || diff === 10) {
                                problems.push([multiples[i], diff, '+']);
                            }
                        }
                    }
                }
            } else if (operation === 'multiples-5-10-subtraction') {
                // Generate multiples of 5 and 10 up to maxSum
                const multiples = [];
                for (let i = 5; i <= maxSum; i += 5) {
                    multiples.push(i);
                }
                
                // For each multiple, create subtraction problems with 5 or 10
                for (let multiple of multiples) {
                    // Subtract 5 (only if result is positive and a multiple of 5)
                    if (multiple - 5 > 0) {
                        problems.push([multiple, 5, '-']);
                    }
                    // Subtract 10 (only if result is positive and a multiple of 5)
                    if (multiple - 10 > 0) {
                        problems.push([multiple, 10, '-']);
                    }
                }
                
                // Also create problems where we subtract 5 or 10 to get from one multiple to another
                for (let i = 0; i < multiples.length; i++) {
                    for (let j = 0; j < multiples.length; j++) {
                        if (i !== j && multiples[i] > multiples[j]) {
                            let diff = multiples[i] - multiples[j];
                            if (diff === 5 || diff === 10) {
                                problems.push([multiples[i], diff, '-']);
                            }
                        }
                    }
                }
            } else {
                for (let sum = minSum; sum <= maxSum; sum++) {
                    if (operation === 'addition' || operation === 'addition-1-20' || operation === 'addition-10-20') {
                        for (let num1 = 1; num1 < sum; num1++) {
                            let num2 = sum - num1;
                            if (num2 > 0) {
                                problems.push([num1, num2, '+']);
                            }
                        }
                    } else if (operation === 'subtraction') {
                        // For subtraction, we want results from 1 to maxSum
                        // All operands (minuend and subtrahend) should be 1-20
                        // At least one operand should be < 10
                        for (let result = 1; result <= maxSum; result++) {
                            for (let subtrahend = 1; subtrahend <= 20; subtrahend++) {
                                let minuend = result + subtrahend;
                                if (minuend <= 20 && (minuend < 10 || subtrahend < 10)) {
                                    problems.push([minuend, subtrahend, '-']);
                                }
                            }
                        }
                    }
                }
            }
            return problems;
        }

        function startPractice(operation, maxNum) {
            currentMode = operation;
            currentMax = maxNum;
            allProblems = generateProblems(operation, maxNum);
            problemCount = 0;

            setFunMode(selectedTheme);
            
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('practice').classList.remove('hidden');
            
            generateProblem();
        }

        function goBack() {
            document.getElementById('practice').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            showingAnswer = false;
            setFunMode(null);
        }

        function generateProblem() {
            // Pick uniformly from all possible problems
            const randomIndex = Math.floor(Math.random() * allProblems.length);
            const [num1, num2, operator] = allProblems[randomIndex];

            // Increment and display counter
            problemCount++;
            document.getElementById('counter').textContent = problemCount;

            const problemEl = document.getElementById('problem');

            if (operator === 'flash') {
                // Flash card: just show the value, large, no answer to reveal
                problemEl.classList.add('flashcard');
                const color = FUN_COLORS[Math.floor(Math.random() * FUN_COLORS.length)];
                problemEl.innerHTML = `<span class="fun-num" style="color:${color}">${num1}</span>`;
                popProblem(problemEl);
                celebrate(problemEl, false); // card fills the screen: no room for a rainbow
                showingAnswer = false;
                return;
            }

            problemEl.classList.remove('flashcard');

            if (operator === '+') {
                currentAnswer = num1 + num2;
            } else if (operator === '×') {
                currentAnswer = num1 * num2;
            } else {
                currentAnswer = num1 - num2;
            }

            // Display the problem
            if (funMode) {
                problemEl.innerHTML =
                    `<span class="fun-num" style="color:${FUN_COLORS[0]}">${num1}</span> ` +
                    `<span class="fun-num" style="color:${FUN_COLORS[1]}">${operator}</span> ` +
                    `<span class="fun-num" style="color:${FUN_COLORS[2]}">${num2}</span> ` +
                    `<span class="fun-num" style="color:${FUN_COLORS[3]}">=</span> ` +
                    `<span class="fun-num" id="answer-slot" style="color:#999">?</span>`;
                popProblem(problemEl);
            } else {
                problemEl.textContent = `${num1} ${operator} ${num2} = ?`;
            }

            showingAnswer = false;
        }

        function showAnswer() {
            if (funMode) {
                const slot = document.getElementById('answer-slot');
                slot.outerHTML = `<span class="fun-answer">${currentAnswer}</span>`;
                showingAnswer = true;
                celebrate(document.getElementById('problem'));
                return;
            }
            const problemText = document.getElementById('problem').textContent;
            document.getElementById('problem').innerHTML = problemText.replace('?', `<span class="blue-answer">${currentAnswer}</span>`);
            showingAnswer = true;
        }

        function isFlashcardMode() {
            return currentMode === 'flashcards-1-10' || currentMode === 'flashcards-10-20' || currentMode === 'flashcards-az';
        }

        function handleKeyPress(event) {
            if ((event.key === 'Enter' || event.key === ' ') && !document.getElementById('practice').classList.contains('hidden')) {
                // Stop space from scrolling or re-clicking a focused button (e.g. Menu)
                event.preventDefault();
                handleProblemClick();
            }
        }

        function handleProblemClick() {
            if (isFlashcardMode() || showingAnswer) {
                generateProblem();
            } else {
                showAnswer();
            }
        }

        // ---------- Fun mode (times tables) ----------
        // [light, bold] pairs; menu buttons cycle through these in order
        const FUN_THEMES = [
            ['#ff9a9e', '#ff5c5c'], ['#ffd166', '#ff9f1c'], ['#fff3a0', '#f7c600'],
            ['#9ef0e6', '#2ec4b6'], ['#a0c4ff', '#3a86ff'], ['#cdb4ff', '#8338ec'],
            ['#ffafcc', '#ff006e'], ['#b9fbc0', '#06d6a0'],
        ];
        let selectedTheme = 0;

        // Color every menu button; remember which one was tapped (capture runs before its onclick)
        document.querySelectorAll('#menu button').forEach((btn, i) => {
            btn.classList.add('tt');
            btn.style.background = FUN_THEMES[i % FUN_THEMES.length][1];
            btn.dataset.theme = i % FUN_THEMES.length;
        });
        document.getElementById('menu').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn) selectedTheme = Number(btn.dataset.theme);
        }, true);

        function popProblem(el) {
            el.classList.remove('fun-pop');
            void el.offsetWidth; // restart animation
            el.classList.add('fun-pop');
        }
        const FUN_COLORS = ['#ff006e', '#8338ec', '#3a86ff', '#06d6a0'];
        let funMode = false;

        function setFunMode(table) {
            funMode = table !== null;
            document.body.classList.toggle('fun', funMode);
            if (funMode) {
                const [a, b] = FUN_THEMES[table] || FUN_THEMES[0];
                document.body.style.setProperty('--fun-a', a);
                document.body.style.setProperty('--fun-b', b);
            }
        }

        // ---------- Celebration: rainbow + confetti, stars and hearts ----------
        const confettiCanvas = document.getElementById('confetti');
        const confettiCtx = confettiCanvas.getContext('2d');
        const RAINBOW = ['#ff0000', '#ff8800', '#ffdd00', '#00cc44', '#0099ff', '#4b0082', '#9b30ff'];
        let confettiPieces = [];
        let rainbows = [];
        let confettiRunning = false;

        function celebrate(el, withRainbow = true) {
            const r = el.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            if (confettiCanvas.width !== window.innerWidth * dpr || confettiCanvas.height !== window.innerHeight * dpr) {
                confettiCanvas.width = window.innerWidth * dpr;
                confettiCanvas.height = window.innerHeight * dpr;
            }
            confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const x = r.left + r.width / 2, y = r.top + r.height / 2;
            // Rainbow arches above the card, legs resting on its top edge
            const radius = Math.max(60, Math.min(r.width * 0.55, window.innerWidth * 0.45, r.top - 10));
            rainbows = withRainbow ? [{ x, y: r.top - 4, radius, life: 0 }] : [];

            for (let i = 0; i < 150; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 10;
                const roll = Math.random();
                confettiPieces.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 6,
                    shape: roll < 0.4 ? 'rect' : roll < 0.7 ? 'star' : 'heart',
                    size: 12 + Math.random() * 14,
                    rot: Math.random() * Math.PI,
                    vrot: (Math.random() - 0.5) * 0.3,
                    color: `hsl(${Math.floor(Math.random() * 360)}, 95%, 55%)`,
                    life: 0,
                });
            }
            if (!confettiRunning) {
                confettiRunning = true;
                requestAnimationFrame(tickConfetti);
            }
        }

        function drawStar(ctx, size) {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const rad = i % 2 === 0 ? size : size * 0.45;
                const a = (i * Math.PI) / 5 - Math.PI / 2;
                ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
            }
            ctx.closePath();
            ctx.fill();
        }

        function drawHeart(ctx, size) {
            const s = size / 16;
            ctx.beginPath();
            ctx.moveTo(0, 5 * s);
            ctx.bezierCurveTo(-14 * s, -4 * s, -8 * s, -16 * s, 0, -8 * s);
            ctx.bezierCurveTo(8 * s, -16 * s, 14 * s, -4 * s, 0, 5 * s);
            ctx.fill();
        }

        function drawRainbow(rb) {
            // Grow in, hold, then fade out
            const grow = Math.min(1, rb.life / 15);
            const alpha = rb.life < 60 ? 1 : Math.max(0, 1 - (rb.life - 60) / 30);
            const band = rb.radius / 14;
            confettiCtx.save();
            confettiCtx.globalAlpha = alpha * 0.9;
            confettiCtx.lineWidth = band;
            RAINBOW.forEach((color, i) => {
                confettiCtx.strokeStyle = color;
                confettiCtx.beginPath();
                confettiCtx.arc(rb.x, rb.y, rb.radius - i * band,
                    Math.PI, Math.PI + Math.PI * grow);
                confettiCtx.stroke();
            });
            confettiCtx.restore();
        }

        function tickConfetti() {
            confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            for (const rb of rainbows) {
                rb.life++;
                drawRainbow(rb);
            }
            rainbows = rainbows.filter(rb => rb.life < 90);

            for (const p of confettiPieces) {
                p.vy += 0.3;          // gravity
                p.vx *= 0.98;         // air drag
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vrot;
                p.life++;
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rot);
                confettiCtx.fillStyle = p.color;
                if (p.shape === 'star') {
                    drawStar(confettiCtx, p.size * 0.6);
                } else if (p.shape === 'heart') {
                    drawHeart(confettiCtx, p.size);
                } else {
                    // Paper confetti flutters by squashing vertically
                    confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, (p.size / 2) * Math.abs(Math.cos(p.life * 0.15)));
                }
                confettiCtx.restore();
            }
            confettiPieces = confettiPieces.filter(p => p.y < window.innerHeight + 40 && p.life < 300);

            if (confettiPieces.length > 0 || rainbows.length > 0) {
                requestAnimationFrame(tickConfetti);
            } else {
                confettiRunning = false;
                confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }
        }

        // Add event listener for keypress
        document.addEventListener('keydown', handleKeyPress);
    </script>
</body>
